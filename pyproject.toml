[project]
name = "agent-reach-web-mcp"
version = "0.1.0"
description = "Web-search MCP server built on the Agent Reach web channel (Exa search + Jina Reader, no API key)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "denpadokei"}]
keywords = ["mcp", "model-context-protocol", "web-search", "agent-reach", "exa", "jina-reader"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp>=2,<3",
    "agent-reach @ git+https://github.com/Panniantong/Agent-Reach",
]

[project.scripts]
agent-reach-web-mcp = "agent_reach_web_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agent_reach_web_mcp"]
